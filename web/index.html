<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>littlechef</title>
<meta name="description" content="家里的菜谱、食材、调味料，和招待客人的菜单。">
<meta name="theme-color" content="#faf6ec">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23faf6ec'/%3E%3Cellipse cx='32' cy='36' rx='20' ry='13' fill='none' stroke='%233a362f' stroke-width='2'/%3E%3Cpath d='M20 22c3-6 21-6 24 0' fill='none' stroke='%23c1714f' stroke-width='2'/%3E%3C/svg%3E">

<!-- 手写体：本地优先（离线可用），没有就走 CDN，都没有就退回系统楷体 -->
<link rel="stylesheet" href="vendor/fonts/wenkai.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.6.0/lxgwwenkailite-regular.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="masthead">
  <a class="house" href="#/">
    <span class="house-name" data-house-name>littlechef</span>
    <span class="house-sub" data-house-sub>家庭菜谱</span>
  </a>
  <div class="masthead-side">
    <button class="ghost-btn" id="btn-new">记一道新菜</button>
    <button class="mode-badge" id="mode-badge" type="button" hidden></button>
    <button class="icon-btn" id="btn-settings" type="button" aria-label="设置" title="设置">⚙</button>
  </div>
</header>

<main id="view" class="view">
  <div class="loading">正在翻开菜谱……</div>
</main>

<footer class="colophon">
  <span class="sq"></span>
  <p>这本菜谱住在家里的 NAS 上 · 数据是 <code>data/</code> 里的一堆 JSON，拷走就是备份</p>
</footer>

<div class="sheet-backdrop fixed-layer" id="sheet-backdrop" hidden>
  <div class="sheet" id="sheet" role="dialog">
    <button class="sheet-close" id="sheet-close" aria-label="关掉">×</button>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<nav class="bottom-nav fixed-layer" id="nav" aria-label="主要导航">
  <div class="bottom-nav-inner">
    <a href="#/" data-route="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8"/></svg><span>家</span></a>
    <a href="#/recipes" data-route="recipes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h6a4 4 0 0 1 3 1 4 4 0 0 1 3-1h6v16h-6a4 4 0 0 0-3 1 4 4 0 0 0-3-1H3ZM12 5v16"/></svg><span>菜谱架</span></a>
    <a href="#/pantry" data-route="pantry"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v4H7zM6 7h12l1 3v11H5V10zM5 12h14M9 16h6"/></svg><span>食材柜</span></a>
    <a href="#/menu" data-route="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17h18M5 17a7 7 0 0 1 14 0M12 7V4M10 4h4M4 21h16"/></svg><span>排一桌</span></a>
    <a href="#/tags" data-route="tags"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8l10 10-8 8L3 11Z"/><circle cx="7.5" cy="7.5" r="1"/></svg><span>标签</span></a>
  </div>
</nav>

<div class="toast fixed-layer" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/util.js"></script>
<script src="js/units.js"></script>
<script src="js/localdb.js"></script>
<script src="js/data.js"></script>
<script src="js/coursegen.js"></script>
<script src="js/views.js"></script>
<script src="js/menu-view.js"></script>
<script src="js/photo-entry.js"></script>
<script src="js/editor.js"></script>
<script src="js/cookmode.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
